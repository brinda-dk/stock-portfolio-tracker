{% extends "base.html" %}

{% block title %}Sign in | Aurelia{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main class="auth-shell">
    <div class="auth-panel">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Return to your<br><em>perspective.</em></h1>
        <p class="auth-intro">Sign in to continue to your private portfolio view.</p>
        <form method="post" class="auth-form">
            <div class="field-group">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button class="password-toggle" type="button" data-password-toggle="password">Show</button>
                </div>
            </div>
            <button class="btn-gold btn-submit" type="submit">Sign in <span>→</span></button>
        </form>
        <p class="auth-switch">New to Aurelia? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</main>
{% endblock %}
