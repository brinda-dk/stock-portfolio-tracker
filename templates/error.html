{% extends "base.html" %}

{% block title %}Service message | Aurelia{% endblock %}

{% block content %}
<main class="dashboard-shell">
    <div class="container">
        <section class="panel-card empty-result">
            <p class="eyebrow">SERVICE MESSAGE</p>
            <h1>{{ status_code }}</h1>
            <p>{{ message }}</p>
            <a class="quiet-action" href="{{ url_for('home') }}">Return home <span>→</span></a>
        </section>
    </div>
</main>
{% endblock %}
